<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролів — DataSecure</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="matrixCanvas" aria-hidden="true"></canvas>


<div class="page-content">

    <header>
        <nav class="navbar">
            <a class="logo" href="index.html">🔐 SavePass</a>
            <div class="nav-links">
                <a href="index.html">Головна</a>
                <a href="security-tips.html">Поради</a>
                <a class="active" href="password-generator.html">Генератор паролів</a>
                <a href="2fa-simulator.html">Симулятор 2FA</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Генератор безпечних паролів</h1>
            <p>Створіть випадковий пароль із заданими параметрами.</p>
        </section>

        <section class="tool-card">
            <label for="passwordLength">
                Довжина пароля:
                <strong id="lengthValue">16</strong>
            </label>

            <input
                type="range"
                id="passwordLength"
                min="8"
                max="40"
                value="16"
            >

            <label>
                <input type="checkbox" id="uppercase" checked>
                Великі літери
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Малі літери
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Цифри
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Спеціальні символи
            </label>

            <div class="password-output">
                <input id="passwordDisplay" readonly placeholder="Ваш пароль">
                <button class="button" id="copyButton">Копіювати</button>
            </div>

            <div class="strength">
                <div id="strengthBar"></div>
            </div>

            <p id="strengthText">Міцність: не оцінено</p>

            <button class="button" id="generateButton">
                🎲 Генерувати пароль
            </button>
        </section>
    </main>

    <footer>© 2026 SavePass </footer>
</div>
    <script src="js/password-generator.js"></script>
    <script src="js/matrix.js"></script>
</body>
</html>
